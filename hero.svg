<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Camilo Eduardo — Desenvolvedor .NET">
  <defs>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#512BD4" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#512BD4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#512BD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0891B2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="58%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#512BD4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#512BD4"/>
      <stop offset="75%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="topbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55"/>
    </pattern>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>

    <clipPath id="frame">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0B1120"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <g filter="url(#soft)">
      <circle cx="220" cy="110" r="190" fill="url(#blobA)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 140 50; 40 -30; 0 0" dur="19s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="210" r="175" fill="url(#blobB)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -130 -45; -40 35; 0 0" dur="23s" repeatCount="indefinite"/>
      </circle>
      <circle cx="610" cy="300" r="150" fill="url(#blobC)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 60 -60; -70 -20; 0 0" dur="27s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="0" y="0" width="1200" height="2" fill="url(#topbar)">
      <animate attributeName="opacity" values="0.35; 1; 0.35" dur="4s" repeatCount="indefinite"/>
    </rect>

    <g fill="#67E8F9">
      <circle cx="150" cy="60" r="2">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1065" cy="78" r="2.5">
        <animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="930" cy="48" r="1.8">
        <animate attributeName="opacity" values="0.2;0.75;0.2" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="240" cy="268" r="2.2">
        <animate attributeName="opacity" values="0.7;0.15;0.7" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="282" r="1.6">
        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
      <text x="600" y="128" font-size="19" letter-spacing="7" fill="#22D3EE" font-weight="600" opacity="0">
        DESENVOLVEDOR .NET
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.15s" fill="freeze"/>
      </text>

      <text x="600" y="206" font-size="68" font-weight="800" fill="url(#shimmer)" opacity="0">
        Camilo Eduardo
        <animate attributeName="opacity" values="0;1" dur="1s" begin="0.4s" fill="freeze"/>
      </text>

      <text x="600" y="252" font-size="20" fill="#94A3B8" letter-spacing="1" opacity="0">
        C# · ASP.NET Core · APIs REST · PostgreSQL · Docker
        <animate attributeName="opacity" values="0;1" dur="1s" begin="0.85s" fill="freeze"/>
      </text>
    </g>

    <rect x="300" y="276" width="600" height="2" rx="1" fill="url(#rule)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="1.1s" fill="freeze"/>
    </rect>
  </g>
</svg>
