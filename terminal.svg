<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="Terminal: perfil de Camilo Eduardo">
  <defs>
    <clipPath id="l1"><rect x="40" y="74" width="0" height="22"><animate attributeName="width" values="0;300" dur="0.7s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="40" y="102" width="0" height="22"><animate attributeName="width" values="0;380" dur="0.5s" begin="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="40" y="130" width="0" height="22"><animate attributeName="width" values="0;560" dur="0.6s" begin="1.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="40" y="158" width="0" height="22"><animate attributeName="width" values="0;380" dur="0.5s" begin="2.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="40" y="186" width="0" height="22"><animate attributeName="width" values="0;510" dur="0.6s" begin="3.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="40" y="214" width="0" height="22"><animate attributeName="width" values="0;490" dur="0.6s" begin="3.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="40" y="242" width="0" height="22"><animate attributeName="width" values="0;580" dur="0.6s" begin="4.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="win"><rect width="1000" height="290" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="1000" height="290" fill="#0B1120"/>
    <rect width="1000" height="44" fill="#111C33"/>
    <line x1="0" y1="44" x2="1000" y2="44" stroke="#1E293B" stroke-width="1"/>
    <circle cx="26" cy="22" r="6" fill="#EF4444"/>
    <circle cx="48" cy="22" r="6" fill="#F59E0B"/>
    <circle cx="70" cy="22" r="6" fill="#22C55E"/>
    <text x="500" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748B">camilo@seven — zsh</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <g clip-path="url(#l1)">
        <text x="40" y="90" fill="#22D3EE">$<tspan x="60" fill="#E2E8F0">whoami --camilo</tspan></text>
      </g>
      <g clip-path="url(#l2)">
        <text x="40" y="118" fill="#64748B">foco<tspan x="160" fill="#CBD5E1">Backend .NET · APIs REST</tspan></text>
      </g>
      <g clip-path="url(#l3)">
        <text x="40" y="146" fill="#64748B">stack<tspan x="160" fill="#CBD5E1">C# · ASP.NET Core · EF Core · CQRS/MediatR</tspan></text>
      </g>
      <g clip-path="url(#l4)">
        <text x="40" y="174" fill="#64748B">dados<tspan x="160" fill="#CBD5E1">PostgreSQL · SQL Server</tspan></text>
      </g>
      <g clip-path="url(#l5)">
        <text x="40" y="202" fill="#64748B">entrega<tspan x="160" fill="#CBD5E1">Docker · Azure DevOps · Nginx/Traefik</tspan></text>
      </g>
      <g clip-path="url(#l6)">
        <text x="40" y="230" fill="#64748B">também<tspan x="160" fill="#CBD5E1">React · TypeScript · RabbitMQ · Pix</tspan></text>
      </g>
      <g clip-path="url(#l7)">
        <text x="40" y="258" fill="#64748B">onde<tspan x="160" fill="#A78BFA">Seven Inovações · São Paulo · desde fev/2024</tspan></text>
      </g>
    </g>

    <rect x="60" y="76" width="9" height="18" fill="#22D3EE">
      <animate attributeName="x" values="60;215;215;590" dur="5.2s" begin="0.3s" fill="freeze" calcMode="discrete" keyTimes="0;0.13;0.85;1"/>
      <animate attributeName="y" values="76;76;244;244" dur="5.2s" begin="0.3s" fill="freeze" calcMode="discrete" keyTimes="0;0.13;0.85;1"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
