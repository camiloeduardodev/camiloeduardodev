<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="1200" height="6" role="presentation">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#512BD4" stop-opacity="0"/>
      <stop offset="20%" stop-color="#512BD4" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#06B6D4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A5F3FC" stop-opacity="1"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="2" width="1200" height="2" rx="1" fill="url(#base)"/>

  <rect y="1" width="240" height="4" rx="2" fill="url(#glow)">
    <animate attributeName="x" values="-240;1200" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
